[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assaypilot"
version = "0.1.0"
description = "AssayPilot stage 0 domain contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.scripts]
assaypilot-loop = "assaypilot.run_loop_cli:main"
assaypilot-stage4-web = "assaypilot.stage4_web:main"
assaypilot-scientific-reasoning = "assaypilot.scientific_reasoning_cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
data = ["httpx>=0.27,<1"]
chem = ["rdkit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
